<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 485" width="980" height="485" role="img" aria-label="Drive simulator: from the current state, sample drive outcomes to the end of the game, repeat 20,000 times, read prices off the distribution" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Drive simulator: from the current state, sample drive outcomes to the end of the game, repeat 20,000 times, read prices off the distribution</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="484" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="30" y="40" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">Phase 2: price a state by playing out its future many times</text>
<rect x="30" y="70" width="250" height="110" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.25"/>
<text x="44" y="93" font-size="14" fill="#0b0b0b" font-weight="600" text-anchor="start">State right now</text>
<text x="44" y="112" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">BAL ball, 1st &amp; 10 at BAL 41</text>
<text x="44" y="132" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">3:10 left in Q4 · BAL 40–32</text>
<text x="44" y="150" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">timeouts 3–3 · prior: pregame line</text>
<text x="44" y="168" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start" font-style="italic">(a real state from BAL at BUF)</text>
<text x="318" y="72" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start" font-style="italic">one sampled future (made-up draws, to show the mechanism)</text>
<rect x="318" y="84" width="186" height="96" rx="8" fill="#fcfcfb" stroke="#898781" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="330" y="106" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">BAL drive (in progress)</text>
<text x="330" y="128" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">draw: punt</text>
<text x="330" y="148" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">uses 1:05 → BUF at own 15</text>
<line x1="504" y1="132" x2="528" y2="132" stroke="#52514e" stroke-width="1.25" marker-end="url(#ah)"/>
<rect x="530" y="84" width="186" height="96" rx="8" fill="#fcfcfb" stroke="#898781" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="542" y="106" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">BUF drive</text>
<text x="542" y="128" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">draw: TD, 2-pt fails</text>
<text x="542" y="148" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">uses 1:30 → BAL 40–38</text>
<line x1="716" y1="132" x2="740" y2="132" stroke="#52514e" stroke-width="1.25" marker-end="url(#ah)"/>
<rect x="742" y="84" width="186" height="96" rx="8" fill="#fcfcfb" stroke="#898781" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="754" y="106" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">BAL drive</text>
<text x="754" y="128" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">draw: end of game</text>
<text x="754" y="148" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">uses 0:35 → 0:00</text>
<line x1="280" y1="125" x2="316" y2="125" stroke="#52514e" stroke-width="1.25" marker-end="url(#ah)"/>
<text x="928" y="206" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="end">final: BAL 40–38</text>
<rect x="30" y="228" width="920" height="70" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
<text x="46" y="254" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">Each drive is a draw from the drive model; where the next one starts is drawn from history:</text>
<text x="46" y="276" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">P(how the drive ends, and the clock it uses | down, distance, field position, clock, score, timeouts, era, pregame line)</text>
<text x="46" y="293" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">ends: TD (+0, +1 or +2 after the try), FG, missed FG, punt, turnover, turnover on downs, safety, defensive TD, end of half</text>
<text x="30" y="340" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">Repeat 20,000 times</text>
<text x="30" y="360" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">(same random numbers for every</text>
<text x="30" y="377" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">state in a game, so prices move</text>
<text x="30" y="394" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">because the game moved)</text>
<line x1="245" y1="368" x2="300" y2="368" stroke="#52514e" stroke-width="1.25" marker-end="url(#ah)"/>
<rect x="310" y="414.4" width="9" height="5.6" fill="#c3c2b7"/>
<rect x="322" y="410.2" width="9" height="9.799999999999999" fill="#c3c2b7"/>
<rect x="334" y="403.2" width="9" height="16.799999999999997" fill="#c3c2b7"/>
<rect x="346" y="392.0" width="9" height="28.0" fill="#c3c2b7"/>
<rect x="358" y="400.4" width="9" height="19.599999999999998" fill="#c3c2b7"/>
<rect x="370" y="378.0" width="9" height="42.0" fill="#c3c2b7"/>
<rect x="382" y="389.2" width="9" height="30.799999999999997" fill="#c3c2b7"/>
<rect x="394" y="396.2" width="9" height="23.799999999999997" fill="#c3c2b7"/>
<rect x="406" y="362.6" width="9" height="57.4" fill="#c3c2b7"/>
<rect x="418" y="383.6" width="9" height="36.4" fill="#c3c2b7"/>
<rect x="430" y="393.4" width="9" height="26.599999999999998" fill="#c3c2b7"/>
<rect x="442" y="343.0" width="9" height="77.0" fill="#c3c2b7"/>
<rect x="454" y="373.8" width="9" height="46.199999999999996" fill="#2a78d6"/>
<rect x="466" y="386.4" width="9" height="33.599999999999994" fill="#2a78d6"/>
<rect x="478" y="394.8" width="9" height="25.2" fill="#2a78d6"/>
<rect x="490" y="400.4" width="9" height="19.599999999999998" fill="#2a78d6"/>
<rect x="502" y="369.6" width="9" height="50.4" fill="#2a78d6"/>
<rect x="514" y="392.0" width="9" height="28.0" fill="#2a78d6"/>
<rect x="526" y="403.2" width="9" height="16.799999999999997" fill="#2a78d6"/>
<rect x="538" y="407.4" width="9" height="12.6" fill="#2a78d6"/>
<rect x="550" y="410.2" width="9" height="9.799999999999999" fill="#2a78d6"/>
<rect x="562" y="413.0" width="9" height="7.0" fill="#2a78d6"/>
<rect x="574" y="415.8" width="9" height="4.199999999999999" fill="#2a78d6"/>
<line x1="306" y1="420" x2="586" y2="420" stroke="#c3c2b7"/>
<text x="310" y="438" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">final margin (schematic shape)</text>
<line x1="600" y1="368" x2="640" y2="368" stroke="#52514e" stroke-width="1.25" marker-end="url(#ah)"/>
<text x="652" y="344" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">winner: share of futures BUF wins, + half the ties</text>
<text x="652" y="366" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">spread rung: share with margin over N.5</text>
<text x="652" y="388" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">total rung: share with total over N.5</text>
<text x="652" y="410" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">→ one run prices every contract consistently</text>
<text x="652" y="436" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">At kickoff, two knobs (the spread and total fed</text>
<text x="652" y="452" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">to the model) are solved so the simulated pregame</text>
<text x="652" y="468" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">margin and total match the pregame line.</text>
</svg>

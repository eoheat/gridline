[project]
name = "gridline"
version = "0.1.0"
description = "Live NFL in-play pricing engine, benchmarked against Kalshi's markets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "polars>=1.20",
  "pyarrow>=15",
  "numpy>=1.26",
  "nflreadpy>=0.1.5",
  "requests>=2.31",
  "xgboost>=2.0",   # macOS: needs `brew install libomp`
  "scikit-learn>=1.5",   # trains the drive-step network (Phase 2)
  "scipy>=1.10",
]

[dependency-groups]
dev = ["pytest>=8"]
docs = ["matplotlib>=3.8"]   # scripts/make_figures.py

[project.scripts]
gridline = "gridline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
